name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
      CLOUDRUN_SERVICE: ${{ secrets.CLOUDRUN_SERVICE }}
      IMAGE_NAME: pitwall-analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project
        run: gcloud config set project "$GCP_PROJECT"

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push container image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPOSITORY/$IMAGE_NAME:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUDRUN_SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.GCP_REGION }}
          allow-unauthenticated: true
          env_vars: |
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            GCS_DB_BLOB_PATH=${{ secrets.GCS_DB_BLOB_PATH }}
