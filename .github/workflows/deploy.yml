name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write   # Required for Workload Identity Federation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY }}
      CLOUDRUN_SERVICE: ${{ secrets.CLOUDRUN_SERVICE }}
      IMAGE_NAME: pitwall-analytics

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set project
        run: gcloud config set project "$GCP_PROJECT"

      - name: Build image via Cloud Build
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPOSITORY/$IMAGE_NAME:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          gcloud builds submit --tag "$IMAGE" --project "$GCP_PROJECT"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUDRUN_SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --memory=4Gi
            --cpu=2
            --timeout=300s
            --min-instances=1
          env_vars: |
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            GCS_DB_BLOB_PATH=${{ secrets.GCS_DB_BLOB_PATH }}
            GCS_SEASONS=${{ secrets.GCS_SEASONS }}
            CORS_ALLOW_ORIGINS=${{ secrets.CORS_ALLOW_ORIGINS }}
            ENABLE_API_DOCS=false
            BACKEND_API_URL=http://127.0.0.1:8080/api
